<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Video Player - Static/CDN Demo</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: #374151;
            color: white;
        }

        .tab-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        #player-wrapper {
            width: 100%;
            max-width: 800px;
        }

        #player-container {
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <h1>Canvas Video Player</h1>
    <p class="subtitle">Static Demo (Uses UMD Build or CDN)</p>

    <div class="tabs">
        <button class="tab-btn active" data-tab="outside">Outside Controls</button>
        <button class="tab-btn" data-tab="overlay">Overlay Controls</button>
        <button class="tab-btn" data-tab="hls">HLS Stream</button>
    </div>

    <div id="player-wrapper">
        <div id="player-container"></div>
    </div>

    <!-- 
      1. LOCAL BUILD:
      Run "npm run build" first, then uncomment the line below.
    -->
    <script src="./dist/canvas-video-player.umd.js"></script>

    <!-- 
      2. CDN (JSDelivr):
      Use this for production or quick testing without building locally.
      (Replace 'version' with the actual published version)
    -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/canvas-video-player@latest/dist/canvas-video-player.umd.js"></script> -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if library is loaded
            if (typeof CanvasVideoPlayer === 'undefined') {
                document.getElementById('player-container').innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ef4444;text-align:center;padding:20px;">
                        <p><strong>Library not found.</strong><br><br>
                        Please run <code>npm run build</code> and uncomment the local script tag in this HTML file.<br>
                        Or ensure the CDN link is valid.</p>
                    </div>
                `;
                return;
            }

            const container = document.getElementById('player-container');
            let player = null;
            let currentTab = 'outside';

            const configs = {
                outside: {
                    url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                    options: {
                        controlsLayout: 'outside',
                        watermarkText: 'Canvas Player\nMultiline Watermark Text'
                    }
                },
                overlay: {
                    url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
                    options: {
                        controlsLayout: 'overlay',
                        watermarkText: 'Static Overlay Demo'
                    }
                },
                hls: {
                    url: 'https://test-streams.mux.dev/x36xhzz/url_6/193039199_mp4_h264_aac_hq_7.m3u8',
                    options: {
                        controlsLayout: 'overlay',
                        watermarkText: 'Static HLS Demo',
                        strategy: 'mse'
                    }
                }
            };

            function initPlayer(configName) {
                if (player) {
                    player.destroy();
                }

                const config = configs[configName];
                player = new CanvasVideoPlayer(container, {
                    videoUrl: config.url,
                    ...config.options
                });
            }

            // Tab Switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTab = btn.dataset.tab;
                    initPlayer(currentTab);
                });
            });

            // Initial Load
            initPlayer('outside');
        });
    </script>
</body>

</html>
