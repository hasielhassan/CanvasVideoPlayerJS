<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Video Player - Dev Demo</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: #374151;
            color: white;
        }

        .tab-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        #player-wrapper {
            width: 100%;
            max-width: 800px;
            /* Aspect ratio handled by player or container */
        }

        #player-container {
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            /* Ensure rounded corners */
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
        }

        input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            flex-grow: 1;
        }

        button.action-btn {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button.action-btn:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <h1>Canvas Video Player Demo</h1>

    <div class="tabs">
        <button class="tab-btn active" data-tab="outside">Outside Controls</button>
        <button class="tab-btn" data-tab="overlay">Overlay Controls</button>
        <button class="tab-btn" data-tab="hls">HLS Stream</button>
    </div>

    <div id="player-wrapper">
        <div id="player-container"></div>
    </div>

    <div class="controls">
        <input type="text" id="watermark-input" placeholder="Update Watermark" value="Confidential">
        <button id="load-btn" class="action-btn">Load New Video</button>
    </div>

    <script type="module">
        import CanvasVideoPlayer from './src/index.js';

        const container = document.getElementById('player-container');
        let player = null;
        let currentTab = 'outside';

        const configs = {
            outside: {
                url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                options: {
                    controlsLayout: 'outside',
                    watermarkText: 'Canvas Player\nMultiline Watermark Text'
                }
            },
            overlay: {
                url: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
                options: {
                    controlsLayout: 'overlay',
                    watermarkText: 'Overlay Controls Demo'
                }
            },
            hls: {
                url: 'https://test-streams.mux.dev/x36xhzz/url_6/193039199_mp4_h264_aac_hq_7.m3u8',
                options: {
                    controlsLayout: 'overlay',
                    watermarkText: 'HLS Stream Demo',
                    strategy: 'mse' // or auto-detect
                }
            }
        };

        function initPlayer(configName) {
            if (player) {
                player.destroy();
            }

            const config = configs[configName];
            player = new CanvasVideoPlayer(container, {
                videoUrl: config.url,
                ...config.options
            });
        }

        // Tab Switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                initPlayer(currentTab);
            });
        });

        // Initial Load
        initPlayer('outside');

        // Interactive Controls
        const watermarkInput = document.getElementById('watermark-input');
        watermarkInput.addEventListener('input', (e) => {
            if (player) player.setWatermark(e.target.value);
        });

        document.getElementById('load-btn').addEventListener('click', () => {
            if (player) {
                // Just reload the current config's URL for simplicity, or a different one
                player.load('http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4');
            }
        });
    </script>
</body>

</html>
